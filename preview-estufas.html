const frame=document.getElementById('app');
let installed=false;

function inject(){
  let w,d;
  try{ w=frame.contentWindow; d=frame.contentDocument; }catch(e){ return; }
  if(!d) return;
  const field=d.getElementById('field');
  const scene=field && field.closest('.scene');
  if(!field || !scene){ setTimeout(inject,250); return; }

  if(!d.getElementById('foto-estufas-preview-style')){
    const st=d.createElement('style');
    st.id='foto-estufas-preview-style';
    st.textContent=`
      #foto-estufas-preview{position:relative;width:100%;overflow:hidden;border-radius:14px;background:#08150f;min-height:210px}
      #foto-estufas-preview img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
      #foto-estufas-preview .estufa-hit{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(13,100,47,.92);color:#fff;font:800 18px/1 system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;padding:0;z-index:5}
      #foto-estufas-preview .estufa-hit:active{transform:translate(-50%,-50%) scale(.94)}
      #foto-estufas-preview .estufa-caption{position:absolute;left:10px;bottom:8px;background:rgba(3,16,10,.72);color:#dff8e6;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 9px;font:600 12px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;pointer-events:none}
    `;
    d.head.appendChild(st);
  }

  function makePhoto(){
    let box=d.getElementById('foto-estufas-preview');
    if(box) return box;
    box=d.createElement('div');
    box.id='foto-estufas-preview';
    box.setAttribute('aria-label','Foto real das sete estufas. Toque em um número para abrir a estufa.');
    const img=d.createElement('img');
    img.src=FOTO;
    img.alt='Foto real das sete estufas da Fazenda Três Mártires';
    box.appendChild(img);
    const pos=[
      [1,3.2,76.5],[2,11.1,69.7],[3,18.1,72.5],[4,27.9,66.5],
      [5,45.9,63.5],[6,66.7,57.0],[7,94.0,51.0]
    ];
    for(const [n,x,y] of pos){
      const b=d.createElement('button');
      b.type='button'; b.className='estufa-hit'; b.textContent=String(n);
      b.setAttribute('aria-label','Abrir Estufa '+n);
      b.style.left=x+'%'; b.style.top=y+'%';
      b.addEventListener('click',()=>openEstufa(n));
      box.appendChild(b);
    }
    const cap=d.createElement('div');
    cap.className='estufa-caption'; cap.textContent='Toque em uma estufa para abrir';
    box.appendChild(cap);
    return box;
  }

  function showPhoto(){
    const cur=d.getElementById('field');
    const sc=cur && cur.closest('.scene');
    if(!cur || !sc) return;
    cur.style.display='none';
    const tip=d.getElementById('tip'); if(tip) tip.style.display='none';
    let box=makePhoto();
    if(!box.isConnected) sc.insertBefore(box,cur);
  }

  function showOriginal(){
    const box=d.getElementById('foto-estufas-preview'); if(box) box.remove();
    const cur=d.getElementById('field'); if(cur) cur.style.display='';
    const tip=d.getElementById('tip'); if(tip) tip.style.display='';
  }

  function findTarget(n){
    const cur=d.getElementById('field'); if(!cur) return null;
    const onclick=[...cur.querySelectorAll('[onclick]')];
    let hit=onclick.find(el=>{
      const txt=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
      return txt.includes('estufa '+n);
    });
    if(hit) return hit;
    hit=onclick.find(el=>{
      const oc=el.getAttribute('onclick')||'';
      return new RegExp('(?:\\D|^)'+n+'(?:\\D|$)').test(oc);
    });
    if(hit) return hit;
    const all=[...cur.querySelectorAll('*')];
    const label=all.find(el=>(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase()==='estufa '+n);
    if(label) return label.closest('[onclick],button,[role="button"]') || label.parentElement;
    return null;
  }

  function openEstufa(n){
    const target=findTarget(n);
    showOriginal();
    let done=false;
    if(target){ try{ target.click(); done=true; }catch(e){} }
    if(!done){
      for(const name of ['focarEstufa','abrirEstufa','selecionarEstufa','mostrarEstufa']){
        if(typeof w[name]==='function'){ try{w[name](n);done=true;break;}catch(e){} }
      }
    }
    if(!done) setTimeout(showPhoto,100);
  }

  if(!installed){
    installed=true;
    d.addEventListener('click',e=>{
      const back=e.target && e.target.closest && e.target.closest('#voltar');
      if(back) setTimeout(showPhoto,120);
    },true);
  }
  showPhoto();
}

frame.addEventListener('load',()=>{installed=false;setTimeout(inject,250)});
setTimeout(inject,500);
})();
</script>
