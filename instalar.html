<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instalar Fazenda Três Mártires</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b5d2a"></head><body style="margin:0;background:#001b0f;color:white;font-family:Arial;text-align:center;padding:50px 20px"><h1>🌱 Fazenda Três Mártires</h1><p>Instalação do aplicativo da fazenda</p><button id="instalar" style="padding:18px 30px;font-size:20px;background:#169447;color:white;border:0;border-radius:12px">Instalar aplicativo</button><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js')}let p;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e});document.getElementById('instalar').onclick=async()=>{if(p){p.prompt();await p.userChoice;p=null}else{alert('Abra o menu ⋮ do Chrome e toque em Instalar aplicativo.')}}</script></body></html>
